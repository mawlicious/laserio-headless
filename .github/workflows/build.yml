name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build Forge jar and verify headless color compatibility
        run: ./gradlew build --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: laserio-headless-jar
          path: build/libs/laserio-*.jar
          if-no-files-found: error
